<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Rendición de Viáticos — GJR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5EF;
  --surface:#FFFFFF;
  --ink:#1C231D;
  --ink-soft:#5C6A5D;
  --primary:#3F5D3A;
  --primary-dark:#2A3F27;
  --primary-tint:#E7EDE3;
  --gold:#B08528;
  --gold-tint:#F4EBD6;
  --rust:#A8452E;
  --rust-tint:#F6E4DE;
  --border:#DDE1D6;
  --radius:10px;
  --mono:ui-monospace,SFMono-Regular,"IBM Plex Mono",Menlo,Consolas,monospace;
  --sans:'DM Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:'DM Serif Display',Georgia,serif;
  --verde:#1B5E20;
}
*{box-sizing:border-box;}
body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 60px;}

/* header — idéntico al de Liquidaciones */
header.gjr-header{
  background:var(--verde);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;
  position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.25);
  margin:0 -20px 22px;
}
header.gjr-header img{height:36px;filter:brightness(0) invert(1);flex:none;}
header.gjr-header h1{font-family:var(--serif);font-size:18px;font-weight:400;letter-spacing:.3px;margin:0;}
header.gjr-header span.sub{font-size:11px;opacity:.7;font-weight:300;display:block;margin-top:1px;}
header.gjr-header .back{margin-left:auto;color:#fff;text-decoration:none;font-size:12.5px;font-weight:600;opacity:.85;white-space:nowrap;}
header.gjr-header .back:hover{opacity:1;}
.persona-select{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 14px 6px 6px;}
.persona-select select{border:none;background:transparent;font-family:var(--sans);font-size:13.5px;color:#fff;font-weight:600;outline:none;}
.persona-select select option{color:var(--ink);}
.persona-select .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);}

/* tabs */
.tabs{display:flex;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--border);}
.tab-btn{background:none;border:none;padding:10px 16px;font-family:var(--sans);font-size:13.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s;}
.tab-btn:hover{color:var(--ink);}
.tab-btn.active{color:var(--primary-dark);border-bottom-color:var(--primary);}

.panel{display:none;}
.panel.active{display:block;animation:fade .2s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;}
.card h2{font-family:var(--serif);font-size:16.5px;margin:0 0 14px;font-weight:600;}
.card h2 .n{color:var(--gold);font-family:var(--mono);font-size:13px;margin-right:8px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
@media(max-width:720px){.grid2,.grid4{grid-template-columns:1fr 1fr;}}
label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);font-weight:700;margin-bottom:5px;}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:7px;background:#FCFDFB;
  font-family:var(--sans);font-size:13.5px;color:var(--ink);outline:none;transition:border-color .15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--primary);}
.field{margin-bottom:12px;}
.btn{border:none;border-radius:7px;padding:10px 16px;font-family:var(--sans);font-size:13.5px;font-weight:700;cursor:pointer;transition:transform .08s, opacity .15s;display:inline-flex;align-items:center;gap:7px;}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-ghost{background:var(--primary-tint);color:var(--primary-dark);}
.btn-ghost:hover{background:#DCE6D6;}
.btn-outline{background:none;border:1px solid var(--border);color:var(--ink);}
.btn-outline:hover{border-color:var(--ink-soft);}
.btn-danger{background:var(--rust-tint);color:var(--rust);}
.btn-danger:hover{background:#F0D3C9;}
.btn-gold{background:var(--gold);color:#fff;}
.btn-gold:hover{background:#96701F;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}

/* dropzone */
.dropzone{border:1.5px dashed #B9C4B2;border-radius:var(--radius);padding:28px 18px;text-align:center;background:var(--primary-tint);cursor:pointer;transition:background .15s,border-color .15s;position:relative;}
.dropzone:hover{background:#DCE6D6;border-color:var(--primary);}
.dropzone .icon{font-size:26px;display:block;margin-bottom:6px;}
.dropzone p{margin:0;font-weight:700;color:var(--primary-dark);font-size:13.5px;}
.dropzone small{color:var(--ink-soft);}

.queue{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
.queue-item{width:74px;text-align:center;}
.queue-thumb{width:74px;height:74px;border-radius:8px;object-fit:cover;border:1px solid var(--border);display:block;position:relative;}
.queue-item .st{font-size:10px;margin-top:4px;color:var(--ink-soft);}
.scanning{position:relative;overflow:hidden;}
.scanning::after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--gold);top:0;animation:scan 1.1s linear infinite;box-shadow:0 0 8px var(--gold);}
@keyframes scan{0%{top:0;}100%{top:100%;}}

/* table */
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);}
table{border-collapse:collapse;width:100%;min-width:980px;font-size:12.5px;}
th{background:var(--primary-tint);color:var(--primary-dark);text-transform:uppercase;font-size:10.5px;letter-spacing:.4px;padding:9px 8px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:6px 8px;border-bottom:1px solid #EEF1EA;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr.new-row{background:var(--gold-tint);animation:fadehl 3s ease forwards;}
@keyframes fadehl{from{background:var(--gold-tint);}to{background:transparent;}}
td input,td select{padding:5px 6px;font-size:12.5px;border-radius:5px;min-width:76px;}
td.num input{font-family:var(--mono);text-align:right;}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;font-size:10.5px;font-weight:700;white-space:nowrap;}
.b-alojamiento{background:#E4ECF3;color:#2E5478;}
.b-desayuno{background:var(--gold-tint);color:var(--gold);}
.b-almuerzo{background:#F4E4D6;color:#96551E;}
.b-cena{background:#EDE1F0;color:#6B3B87;}
.b-pasajes{background:#DCEFE6;color:#1F7A54;}
.b-movilidad{background:#DDEAF2;color:#276F92;}
.b-otros{background:#EDEEEA;color:var(--ink-soft);}
.del-row{background:none;border:none;color:var(--rust);cursor:pointer;font-size:15px;padding:2px 5px;}
.del-row:hover{background:var(--rust-tint);border-radius:5px;}

/* totals */
.totals{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px;}
.tot-card{background:var(--primary-tint);border-radius:8px;padding:12px 14px;}
.tot-card .lbl{font-size:11px;color:var(--primary-dark);text-transform:uppercase;letter-spacing:.4px;font-weight:700;}
.tot-card .val{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--ink);margin-top:3px;}
.tot-card.gold{background:var(--gold-tint);}
.tot-card.gold .lbl{color:var(--gold);}
.tot-card.rust{background:var(--rust-tint);}
.tot-card.rust .lbl{color:var(--rust);}

/* historial */
.rend-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.rend-card .meta h3{margin:0 0 3px;font-family:var(--serif);font-size:15px;}
.rend-card .meta .sub{color:var(--ink-soft);font-size:12px;}
.rend-card .amounts{display:flex;gap:16px;}
.rend-card .amounts div{text-align:right;}
.rend-card .amounts .lbl{font-size:10px;color:var(--ink-soft);text-transform:uppercase;}
.rend-card .amounts .val{font-family:var(--mono);font-weight:700;font-size:15px;}
.empty{text-align:center;padding:50px 20px;color:var(--ink-soft);}
.empty .icon{font-size:34px;display:block;margin-bottom:10px;}

/* stats */
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:900px){.statgrid{grid-template-columns:1fr;}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
@media(max-width:720px){.kpis{grid-template-columns:1fr 1fr;}}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
.kpi .lbl{font-size:10.5px;text-transform:uppercase;color:var(--ink-soft);font-weight:700;letter-spacing:.4px;}
.kpi .val{font-family:var(--mono);font-size:20px;font-weight:700;margin-top:4px;}
canvas{max-height:280px;}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.filters select{width:auto;min-width:140px;}
.toprow{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.savingtag{font-size:11.5px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}
.savingtag .pulse{width:7px;height:7px;border-radius:50%;background:var(--primary);}
</style>
</head>

<script>
/* ---------------- constantes ---------------- */
const TIPOS = [
  {v:'alojamiento', label:'Alojamiento', col:'H', cls:'b-alojamiento'},
  {v:'desayuno',     label:'Desayuno',    col:'I', cls:'b-desayuno'},

];
const tipoInfo = v => TIPOS.find(t=>t.v===v) || TIPOS[6];
const UNIDADES = ['Administrativo','Comercial','Operaciones','Logística','Otros'];

/* ---------------- estado ---------------- */
let allRendiciones = [];   // cargado de storage compartido
let draft = null;          // rendición en curso {id,persona,motivo,dni,dsrSoles,dsrDolares,items:[]}
let uploading = 0;
let storageOk = true;

const uid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const fmt = n => (Number(n)||0).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
const todayISO = () => new Date().toISOString().slice(0,10);

/* ---------------- configuración ---------------- */
const SUPABASE_URL = 'https://riidmxztyxldnojjkncx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ZbMZbTdBcYnGceF_woayjQ_CCCEHRYS';
const AI_PROXY_URL = 'https://viaticos-ia.gjr-viaticos-jm.workers.dev'; // Cloudflare Worker (proxy seguro hacia la API de Anthropic)
const ADMINS = ['jose maria', 'jose maría', 'josé maría', 'josé maria', 'jose', 'renato'];

const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

function normalizar(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function esAdmin(){
  const id = usuarioId();
  if(id) return ['jose','renato'].includes(id);
  const n = normalizar(usuarioSesion());
  return n.includes('jose') || n.includes('renato');
}
function usuarioSesion(){
  try{ return sessionStorage.getItem('gjr_nombre') || null; }catch(e){ return null; }
}
function usuarioId(){
  try{ return sessionStorage.getItem('gjr_user') || null; }catch(e){ return null; }
}

/* ---------------- storage (Supabase) ---------------- */
async function loadRendiciones(){
  if(!sb){ allRendiciones = []; storageOk = false; return; }
  try{
    const {data, error} = await sb.from('viaticos').select('*').order('created_at', {ascending:false});
    if(error) throw error;
    allRendiciones = (data||[]).map(r => r.data);
    storageOk = true;
  }catch(e){ console.error('Supabase load:', e); allRendiciones = []; storageOk = false; }
}
async function persistRendicion(r){
  if(!sb){ storageOk = false; return; }
  try{
    const {error} = await sb.from('viaticos').upsert({id: r.id, persona: r.persona, created_at: r.createdAt, data: r});
    if(error) throw error;
    storageOk = true;
  }catch(e){ console.error('Supabase save:', e); storageOk = false; alert('No se pudo guardar en la nube. Revisa tu conexión.'); }
}
async function removeRendicion(id){
  if(!sb) return;
  try{ await sb.from('viaticos').delete().eq('id', id); }
  catch(e){ console.error('Supabase delete:', e); }
}

/* ---------------- extracción IA ---------------- */
const SYSTEM_PROMPT = `Eres un asistente que extrae datos de comprobantes de gasto (boletas, facturas, tickets) de Perú para un sistema de rendición de viáticos corporativo. Analiza la imagen y responde SOLO con un objeto JSON válido, sin texto adicional, sin explicaciones, sin backticks ni markdown. Formato exacto:
{"fecha":"YYYY-MM-DD o null","proveedor":"nombre del establecimiento","comprobante":"número de boleta/factura/ticket o null","monto":0.00,"moneda":"Soles o Dólares","tipoGasto":"alojamiento|desayuno|almuerzo|cena|pasajes|movilidad|otros","concepto":"descripción corta, máx 8 palabras"}
Reglas: moneda es "Soles" si ves S/. o el contexto es peruano; "Dólares" si ves $ o USD. tipoGasto: hoteles/hospedaje="alojamiento"; restaurantes o comida="desayuno","almuerzo" o "cena" según lo que indique el comprobante (si no es claro usa "almuerzo"); vuelos/buses/pasajes de viaje="pasajes"; taxi/uber/movilidad local="movilidad"; cualquier otro="otros". monto es el total pagado, solo número. Si un campo no es determinable usa tu mejor estimación razonable, salvo fecha y comprobante que pueden ser null.`;

function parseJSON(text){
  let t = text.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  const m = t.match(/\{[\s\S]*\}/);
  if(m) t = m[0];
  return JSON.parse(t);
}

async function extractFromImage(base64, mediaType){
  const enClaude = location.hostname.includes('claude') || location.hostname === '';
  if(!AI_PROXY_URL && !enClaude){
    throw new Error('lectura IA no configurada: falta la URL del Cloudflare Worker — ver GUIA_VIATICOS');
  }
  const endpoint = AI_PROXY_URL || 'https://api.anthropic.com/v1/messages';
  const res = await fetch(endpoint, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      model:'claude-sonnet-4-6',
      max_tokens:500,
      system: SYSTEM_PROMPT,
      messages:[{role:'user', content:[
        {type:'image', source:{type:'base64', media_type: mediaType, data: base64}},
        {type:'text', text:'Extrae los datos de este comprobante y responde solo con el JSON.'}
      ]}]
    })
  });
  if(!res.ok){
    let detail = '';
    try{ const e = await res.json(); detail = e.error && e.error.message ? e.error.message : ''; }catch(_){ }
    throw new Error('servicio IA respondió ' + res.status + (detail ? ': '+detail.slice(0,80) : ''));
  }
  const data = await res.json();
  const textBlock = (data.content||[]).find(b=>b.type==='text');
  if(!textBlock) throw new Error('sin respuesta del servicio IA');
  return parseJSON(textBlock.text);
}

function fileToNormalizedJPEG(file, maxDim=1600, quality=0.85){
  return new Promise((resolve,reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      let w = img.naturalWidth, h = img.naturalHeight;
      if(!w || !h){ URL.revokeObjectURL(url); reject(new Error('imagen vacía o formato no soportado (¿HEIC?)')); return; }
      if(w>maxDim || h>maxDim){
        const scale = maxDim / Math.max(w,h);
        w = Math.round(w*scale); h = Math.round(h*scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      const dataUrl = canvas.toDataURL('image/jpeg', quality);
      resolve(dataUrl.split(',')[1]);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('el navegador no pudo decodificar esta foto (formato HEIC no compatible en este dispositivo)')); };
    img.src = url;
  });
}

function personaValue(){
  const sel = document.getElementById('personaGlobal');
  if(!sel) return 'José María Pascual';
  return sel.value === '__otro__' ? (window.__otroPersona||'Otro') : sel.value;
}
function computeTotals(items){
  const base = ()=>({alojamiento:0,desayuno:0,almuerzo:0,cena:0,otros:0,pasajes:0,movilidad:0,total:0});
  const t = {Soles: base(), Dólares: base()};
  items.forEach(it=>{
    const mon = t[it.moneda] ? it.moneda : 'Soles';
    const val = Number(it.monto)||0;
    t[mon][it.tipoGasto] = (t[mon][it.tipoGasto]||0) + val;
    t[mon].total += val;
  });
  return t;
}

function renderItemsTable(items, editable){
  const rows = items.map((it,i)=>{
    const info = tipoInfo(it.tipoGasto);
    if(!editable){
      return `<tr>
        <td>${i+1}</td><td>${it.fecha||''}</td><td>${escapeHtml(it.concepto)}</td>
        <td>${escapeHtml(it.proveedor||'')}</td><td>${escapeHtml(it.comprobante||'')}</td>
        <td><span class="badge ${info.cls}">${info.label}</span></td>
        <td class="num">${fmt(it.monto)}</td><td>${it.moneda}</td>
      </tr>`;
    }
    return `<tr data-id="${it.id}" class="${it._new?'new-row':''}">
      <td>${i+1}</td>
      <td><input type="date" data-f="fecha" value="${it.fecha||''}"></td>
      <td><input type="text" data-f="concepto" value="${escapeAttr(it.concepto)}" style="min-width:150px;"></td>
      <td><input type="text" data-f="proveedor" value="${escapeAttr(it.proveedor||'')}" style="min-width:120px;"></td>
      <td><input type="text" data-f="comprobante" value="${escapeAttr(it.comprobante||'')}" style="min-width:90px;"></td>
      <td><select data-f="unidadNegocio">${UNIDADES.map(u=>`<option ${it.unidadNegocio===u?'selected':''}>${u}</option>`).join('')}</select></td>
      <td><select data-f="tipoGasto">${TIPOS.map(t=>`<option value="${t.v}" ${it.tipoGasto===t.v?'selected':''}>${t.label}</option>`).join('')}</select></td>
      <td class="num"><input type="number" step="0.01" data-f="monto" value="${it.monto}" style="width:80px;"></td>
      <td><select data-f="moneda"><option ${it.moneda==='Soles'?'selected':''}>Soles</option><option ${it.moneda==='Dólares'?'selected':''}>Dólares</option></select></td>
      <td><button class="del-row" data-del="${it.id}" title="Eliminar">✕</button></td>
    </tr>`;
  }).join('');

  const head = editable
    ? `<tr><th>#</th><th>Fecha</th><th>Concepto</th><th>Proveedor</th><th>Comprobante</th><th>Unidad</th><th>Tipo</th><th>Monto</th><th>Mon.</th><th></th></tr>`
    : `<tr><th>#</th><th>Fecha</th><th>Concepto</th><th>Proveedor</th><th>Comprobante</th><th>Tipo</th><th>Monto</th><th>Mon.</th></tr>`;

  return `<div class="tablewrap"><table><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
}

function wireItemInputs(){
  document.querySelectorAll('#panel-nueva [data-f]').forEach(inp=>{
    inp.addEventListener('change', e=>{
      const row = e.target.closest('tr');
      const id = row.dataset.id;
      const item = draft.items.find(x=>x.id===id);
      const f = e.target.dataset.f;
      item[f] = f==='monto' ? Number(e.target.value) : e.target.value;
      item._new = false;
      renderNueva();
    });
  });
  document.querySelectorAll('#panel-nueva [data-del]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      draft.items = draft.items.filter(x=>x.id!==e.target.dataset.del);
      renderNueva();
    });
  });
}

function wireDropzone(){
  const dz = document.getElementById('dropzone');
  const input = document.getElementById('fileInput');
  dz.addEventListener('click', ()=> input.click());
  input.addEventListener('change', e=> handleFiles([...e.target.files]));
  dz.addEventListener('dragover', e=>{e.preventDefault(); dz.style.background='#DCE6D6';});
  dz.addEventListener('dragleave', ()=> dz.style.background='');
  dz.addEventListener('drop', e=>{
    e.preventDefault(); dz.style.background='';
    handleFiles([...e.dataTransfer.files].filter(f=>f.type.startsWith('image/')));
  });
}

async function handleFiles(files){
  for(const file of files){
    const qid = uid();
    const url = URL.createObjectURL(file);
    const div = document.createElement('div');
    div.className='queue-item';
    div.innerHTML = `<img class="queue-thumb scanning" src="${url}"><div class="st" id="st-${qid}">Leyendo…</div>`;
    const queue = document.getElementById('queue');
    if(queue) queue.appendChild(div);
    const statusEl = () => document.getElementById(`st-${qid}`);
    const thumbEl = () => div.querySelector('.queue-thumb');

    try{
      const base64 = await fileToNormalizedJPEG(file);
      const extracted = await extractFromImage(base64, 'image/jpeg');
      const item = {
        id: uid(),
        fecha: extracted.fecha || todayISO(),
        concepto: extracted.concepto || 'Gasto sin descripción',
        proveedor: extracted.proveedor || '',
        comprobante: extracted.comprobante || '',
        unidadNegocio: 'Administrativo',
        tipoGasto: TIPOS.some(t=>t.v===extracted.tipoGasto) ? extracted.tipoGasto : 'otros',
        monto: Number(extracted.monto)||0,
        moneda: extracted.moneda==='Dólares' ? 'Dólares' : 'Soles',
        _new:true
      };
      draft.items.push(item);
      if(thumbEl()) thumbEl().classList.remove('scanning');
      if(statusEl()) statusEl().textContent = 'Listo ✓';
      renderNueva();
    }catch(err){
      console.error('Error leyendo comprobante:', err);
      draft.items.push({id:uid(), fecha:todayISO(), concepto:'No se pudo leer automáticamente — completar manualmente ('+(err.message||'error')+')', proveedor:'', comprobante:'', unidadNegocio:'Administrativo', tipoGasto:'otros', monto:0, moneda:'Soles', _new:true});
      if(thumbEl()) thumbEl().classList.remove('scanning');
      if(statusEl()) statusEl().textContent = 'Error — revisar';
      renderNueva();
    }
  }
}

function cancelDraft(){
  if(draft.items.length && !confirm('¿Descartar esta rendición en curso?')) return;
  draft = null;
  renderNueva();
}
async function saveDraft(){
  const idx = allRendiciones.findIndex(r=>r.id===draft.id);
  const clean = {...draft, items: draft.items.map(({_new,...rest})=>rest)};
  if(idx>=0) allRendiciones[idx] = clean; else allRendiciones.unshift(clean);
  await persistRendicion(clean);
  draft = null;
  renderNueva();
  renderHistorial();
  renderStats();
  switchTab('historial');
}

function drawStats(){
  const fp = document.getElementById('filtroPersona');
  const persona = fp ? fp.value : '';
  const moneda = document.getElementById('filtroMoneda').value;
  const visibles = rendicionesVisibles();
  let items = [];
  visibles.forEach(r=>{
    if(persona && r.persona!==persona) return;
    r.items.forEach(it=> items.push({...it, persona:r.persona}));
  });
  if(moneda) items = items.filter(it=>it.moneda===moneda);

  // KPIs
  const totalSoles = items.filter(i=>i.moneda==='Soles').reduce((s,i)=>s+Number(i.monto||0),0);
  const totalDolares = items.filter(i=>i.moneda==='Dólares').reduce((s,i)=>s+Number(i.monto||0),0);
  const nRend = visibles.filter(r=> !persona || r.persona===persona).length;
  const promedio = nRend? (totalSoles/nRend) : 0;
  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><div class="lbl">Rendiciones</div><div class="val">${nRend}</div></div>
    <div class="kpi"><div class="lbl">Gasto total S/.</div><div class="val">${fmt(totalSoles)}</div></div>
    <div class="kpi"><div class="lbl">Gasto total US$</div><div class="val">${fmt(totalDolares)}</div></div>
    <div class="kpi"><div class="lbl">Promedio S/. por rendición</div><div class="val">${fmt(promedio)}</div></div>`;

  // Panel de control (solo admins): totales y saldos por persona
  const resumenEl = document.getElementById('adminResumen');
  if(resumenEl){
    const porPers = {};
    visibles.forEach(r=>{
      const t = computeTotals(r.items);
      if(!porPers[r.persona]) porPers[r.persona] = {rend:0, soles:0, dolares:0, dsrS:0, dsrD:0};
      const p = porPers[r.persona];
      p.rend++; p.soles += t.Soles.total; p.dolares += t.Dólares.total;
      p.dsrS += Number(r.dsrSoles)||0; p.dsrD += Number(r.dsrDolares)||0;
    });
    const rows = Object.entries(porPers).map(([nombre,p])=>{
      const saldoS = p.dsrS - p.soles, saldoD = p.dsrD - p.dolares;
      return `<tr>
        <td style="font-weight:600">${escapeHtml(nombre)}</td>
        <td style="text-align:center">${p.rend}</td>
        <td class="num" style="text-align:right;font-family:var(--mono)">${fmt(p.soles)}</td>
        <td class="num" style="text-align:right;font-family:var(--mono)">${fmt(p.dolares)}</td>
        <td class="num" style="text-align:right;font-family:var(--mono);color:${saldoS<0?'var(--rust)':'var(--primary-dark)'}">${fmt(saldoS)}</td>
        <td class="num" style="text-align:right;font-family:var(--mono);color:${saldoD<0?'var(--rust)':'var(--primary-dark)'}">${fmt(saldoD)}</td>
      </tr>`;
    }).join('');
    resumenEl.innerHTML = `<div class="tablewrap"><table style="min-width:640px">
      <thead><tr><th>Persona</th><th style="text-align:center">Rendiciones</th><th style="text-align:right">Gastado S/.</th><th style="text-align:right">Gastado US$</th><th style="text-align:right">Saldo a favor S/.</th><th style="text-align:right">Saldo a favor US$</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
      <div style="font-size:11.5px;color:var(--ink-soft);margin-top:8px">Saldo a favor = dinero entregado a rendir − total gastado. Un saldo negativo (rojo) indica gasto mayor al anticipo.</div>`;
  }

  // por mes
  const porMes = {};
  items.forEach(it=>{ const m=(it.fecha||'').slice(0,7)||'s/f'; porMes[m]=(porMes[m]||0)+Number(it.monto||0); });
  const mesesOrdenados = Object.keys(porMes).sort();

  // por tipo
  const porTipo = {}; TIPOS.forEach(t=>porTipo[t.label]=0);
  items.forEach(it=> porTipo[tipoInfo(it.tipoGasto).label] += Number(it.monto||0));

  // por proveedor
  const porProv = {};
  items.forEach(it=>{ const p = it.proveedor||'Sin especificar'; porProv[p]=(porProv[p]||0)+Number(it.monto||0); });
  const topProv = Object.entries(porProv).sort((a,b)=>b[1]-a[1]).slice(0,8);

  // por persona
  const porPersona = {};
  items.forEach(it=>{ porPersona[it.persona]=(porPersona[it.persona]||0)+Number(it.monto||0); });

  const palette = ['#3F5D3A','#B08528','#A8452E','#2E5478','#6B3B87','#1F7A54','#276F92','#96551E'];

  [chartMes,chartTipo,chartProveedor,chartPersona].forEach(c=>c&&c.destroy());

  chartMes = new Chart(document.getElementById('cMes'), {
    type:'bar',
    data:{labels:mesesOrdenados, datasets:[{label:'Monto', data:mesesOrdenados.map(m=>porMes[m]), backgroundColor:'#3F5D3A', borderRadius:4}]},
    options:{plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}}}
  });
  chartTipo = new Chart(document.getElementById('cTipo'), {
    type:'doughnut',
    data:{labels:Object.keys(porTipo), datasets:[{data:Object.values(porTipo), backgroundColor:palette}]},
    options:{plugins:{legend:{position:'bottom', labels:{boxWidth:10,font:{size:10}}}}}
  });
  chartProveedor = new Chart(document.getElementById('cProveedor'), {
    type:'bar',
    data:{labels:topProv.map(p=>p[0]), datasets:[{label:'Monto', data:topProv.map(p=>p[1]), backgroundColor:'#B08528', borderRadius:4}]},
    options:{indexAxis:'y', plugins:{legend:{display:false}}}
  });
  const cPersonaEl = document.getElementById('cPersona');
  if(cPersonaEl) chartPersona = new Chart(cPersonaEl, {
    type:'bar',
    data:{labels:Object.keys(porPersona), datasets:[{label:'Monto', data:Object.values(porPersona), backgroundColor:'#276F92', borderRadius:4}]},
    options:{plugins:{legend:{display:false}}}
  });
}

/* ---------------- Exportar a Excel (plantilla GJR) ---------------- */
const COLS = {B:1,C:2,D:3,E:4,F:5,G:6,H:7,I:8,J:9,K:10,L:11,M:12,N:13,O:14,P:15,Q:16};
function ref(col,row){ return XLSX.utils.encode_cell({r:row-1, c:COLS[col]}); }

function exportRendicion(r){
  if(!r) return;
  const items = r.items;
  const dataRows = Math.max(items.length, 19);
  const lastItemRow = 19 + dataRows;
  const totSolesRow = lastItemRow+1, totDolRow = lastItemRow+2;
  const saldoSolesRow = lastItemRow+6, saldoDolRow = lastItemRow+7;
  const comentRow = lastItemRow+9, firmaRow = lastItemRow+15;

  const ws = {};
  const set = (col,row,v,opts={}) => {
    const cell = {};
    if(opts.f){ cell.t='n'; cell.f=opts.f; }
    else if(typeof v === 'number'){ cell.t='n'; cell.v=v; }
    else { cell.t='s'; cell.v = v==null? '' : String(v); }
    ws[ref(col,row)] = cell;
  };

  set('D',4,'RENDICIÓN DE VIÁTICOS');
  set('B',11,'MOTIVO DE LOS VIÁTICOS:'); set('E',11, r.motivo||'');
  set('B',12,'APELLIDOS Y NOMBRES'); set('E',12, r.persona||'');
  set('B',13,'DNI O CARNET DE EXTRANJERÍA:'); set('E',13, r.dni||'');
  set('L',15,'DINERO SUJETO A RENDICIÓN (Soles):'); set('O',15, Number(r.dsrSoles)||0);
  set('L',16,'DINERO SUJETO A RENDICIÓN (Dólares):'); set('O',16, Number(r.dsrDolares)||0);

  set('B',17,'Nº ORDEN'); set('C',17,'FECHA'); set('D',17,'CONCEPTO'); set('F',17,'Nº DE COMPROBANTE DE PAGO');
  set('G',17,'U.N'); set('H',17,'VIÁTICOS'); set('M',17,'PASAJES'); set('N',17,'MOVILIDAD LOCAL');
  set('O',17,'TOTAL GASTO'); set('P',17,'MON(Soles) (Dolares)'); set('Q',17,'PROVEEDOR (ref. interna)');
  set('H',18,'ALOJAMIENTO'); set('I',18,'ALIMENTACIÓN'); set('L',18,'OTROS');
  set('I',19,'DESAYUNO S/.'); set('J',19,'ALMUERZO S/.'); set('K',19,'CENA S/.');

  for(let i=0;i<dataRows;i++){
    const row = 20+i;
    const it = items[i];
    set('B',row, i+1);
    if(it){
      set('C',row, it.fecha||'');
      set('D',row, it.concepto||'');
      set('F',row, it.comprobante||'');
      set('G',row, it.unidadNegocio||'');
      TIPOS.forEach(t=>{ if(it.tipoGasto===t.v) set(t.col,row, Number(it.monto)||0); });
      set('O',row, 0, {f:`SUM(H${row}:N${row})`});
      set('P',row, it.moneda||'Soles');
      set('Q',row, it.proveedor||'');
    } else {
      set('O',row, 0, {f:`SUM(H${row}:N${row})`});
    }
  }

  set('F',totSolesRow,'Soles');
  set('F',totDolRow,'Dólares');
  ['H','I','J','K','L','M','N','O'].forEach(col=>{
    set(col, totSolesRow, 0, {f:`SUMIF($P$20:$P$${lastItemRow},$F$${totSolesRow},${col}20:${col}${lastItemRow})`});
    set(col, totDolRow, 0, {f:`SUMIF($P$20:$P$${lastItemRow},$F$${totDolRow},${col}20:${col}${lastItemRow})`});
  });

  set('K',saldoSolesRow,'SALDO A FAVOR SOLES'); set('O',saldoSolesRow, 0, {f:`O15-O${totSolesRow}`});
  set('K',saldoDolRow,'SALDO A FAVOR DÓLARES'); set('O',saldoDolRow, 0, {f:`O16-O${totDolRow}`});

  set('B',comentRow,'Comentarios:');
  set('D',firmaRow,'FIRMA TRABAJADOR'); set('K',firmaRow,'FIRMA EMPLEADOR');

  const maxRow = firmaRow+1;
  ws['!ref'] = XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:maxRow, c:16}});
  ws['!merges'] = [
    {s:{r:3,c:3}, e:{r:5,c:14}},                // D4:O6 título
    {s:{r:11,c:1}, e:{r:11,c:3}},                // B12:D12 etiqueta nombres
    {s:{r:12,c:1}, e:{r:12,c:3}},                // B13:D13 etiqueta DNI
    {s:{r:16,c:1}, e:{r:18,c:1}},                // B17:B19
    {s:{r:16,c:2}, e:{r:18,c:2}},                // C17:C19
    {s:{r:16,c:3}, e:{r:18,c:4}},                // D17:E19
    {s:{r:16,c:5}, e:{r:18,c:5}},                // F17:F19
    {s:{r:16,c:6}, e:{r:18,c:6}},                // G17:G19
    {s:{r:16,c:7}, e:{r:16,c:11}},               // H17:L17
    {s:{r:17,c:7}, e:{r:18,c:7}},                // H18:H19
    {s:{r:17,c:8}, e:{r:17,c:10}},               // I18:K18
    {s:{r:17,c:11}, e:{r:18,c:11}},              // L18:L19
    {s:{r:16,c:12}, e:{r:18,c:12}},              // M17:M19
    {s:{r:16,c:13}, e:{r:18,c:13}},              // N17:N19
    {s:{r:16,c:14}, e:{r:18,c:14}},              // O17:O19
    {s:{r:16,c:15}, e:{r:18,c:15}},              // P17:P19
    {s:{r:saldoSolesRow-1,c:10}, e:{r:saldoSolesRow-1,c:13}},  // K:N saldo soles
    {s:{r:saldoDolRow-1,c:10}, e:{r:saldoDolRow-1,c:13}},      // K:N saldo dólares
    {s:{r:firmaRow-1,c:10}, e:{r:firmaRow-1,c:13}},            // K:N firma empleador
  ];
  for(let i=0;i<dataRows;i++){ const row=20+i; ws['!merges'].push({s:{r:row-1,c:3}, e:{r:row-1,c:4}}); }

  ws['!cols'] = [{wch:3},{wch:6},{wch:11},{wch:26},{wch:8},{wch:16},{wch:13},{wch:11},{wch:9},{wch:9},{wch:9},{wch:9},{wch:9},{wch:11},{wch:11},{wch:14},{wch:20}];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'ER');
  const filename = `Viaticos_${(r.persona||'').replace(/\s+/g,'_')}_${(r.createdAt||'').slice(0,10)}.xlsx`;
  XLSX.writeFile(wb, filename);
}

/* ---------------- Imprimir / PDF ---------------- */
function imprimirRendicionById(id){ imprimirRendicion(allRendiciones.find(r=>r.id===id)); }
function imprimirRendicion(r){
  if(!r || !r.items.length) return;
  const t = computeTotals(r.items);
  const logoSrc = (document.querySelector('header.gjr-header img')||{}).src || '';
  const filas = r.items.map((it,i)=>{
    const cols = {alojamiento:'',desayuno:'',almuerzo:'',cena:'',otros:'',pasajes:'',movilidad:''};
    cols[it.tipoGasto] = fmt(it.monto);
    return `<tr>
      <td class="c">${i+1}</td><td class="c">${it.fecha||''}</td>
      <td>${escapeHtml(it.concepto||'')}${it.proveedor?` <span class="prov">(${escapeHtml(it.proveedor)})</span>`:''}</td>
      <td class="c">${escapeHtml(it.comprobante||'')}</td><td class="c">${escapeHtml(it.unidadNegocio||'')}</td>
      <td class="n">${cols.alojamiento}</td><td class="n">${cols.desayuno}</td><td class="n">${cols.almuerzo}</td>
      <td class="n">${cols.cena}</td><td class="n">${cols.otros}</td><td class="n">${cols.pasajes}</td><td class="n">${cols.movilidad}</td>
      <td class="n b">${fmt(it.monto)}</td><td class="c">${it.moneda==='Dólares'?'US$':'S/.'}</td>
    </tr>`;
  }).join('');
  const totRow = (mon,tt)=>`<tr class="tot">
    <td colspan="5" class="r b">TOTAL ${mon==='Soles'?'SOLES S/.':'DÓLARES US$'}</td>
    <td class="n b">${fmt(tt.alojamiento)}</td><td class="n b">${fmt(tt.desayuno)}</td><td class="n b">${fmt(tt.almuerzo)}</td>
    <td class="n b">${fmt(tt.cena)}</td><td class="n b">${fmt(tt.otros)}</td><td class="n b">${fmt(tt.pasajes)}</td><td class="n b">${fmt(tt.movilidad)}</td>
    <td class="n b">${fmt(tt.total)}</td><td></td></tr>`;
  const w = window.open('', '_blank');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Rendición de Viáticos — ${escapeHtml(r.persona)}</title>
  <style>
    @page{size:A4 landscape;margin:12mm;}
    body{font-family:Arial,Helvetica,sans-serif;font-size:10px;color:#1C231D;margin:0;}
    .head{display:flex;align-items:center;gap:14px;border-bottom:3px solid #1B5E20;padding-bottom:10px;margin-bottom:12px;}
    .head img{height:44px;}
    .head h1{font-size:17px;margin:0;color:#1B5E20;letter-spacing:.5px;}
    .head .emp{font-size:10px;color:#555;margin-top:2px;}
    .datos{display:grid;grid-template-columns:1fr 1fr;gap:4px 30px;margin-bottom:12px;font-size:10.5px;}
    .datos b{color:#1B5E20;}
    table{border-collapse:collapse;width:100%;font-size:8.6px;}
    th,td{border:1px solid #999;padding:3px 4px;}
    th{background:#E7EDE3;color:#1B5E20;font-size:7.8px;text-transform:uppercase;}
    td.c{text-align:center;} td.n{text-align:right;font-variant-numeric:tabular-nums;} td.r{text-align:right;} .b{font-weight:bold;}
    .prov{color:#666;font-size:8px;}
    tr.tot td{background:#F4EBD6;}
    .saldos{margin-top:10px;display:flex;gap:26px;font-size:11px;}
    .saldos div{border:1px solid #999;padding:6px 14px;}
    .saldos b{color:#1B5E20;}
    .firmas{margin-top:52px;display:flex;justify-content:space-around;text-align:center;font-size:10px;}
    .firmas div{border-top:1px solid #333;padding-top:5px;width:200px;}
  </style></head><body>
  <div class="head">
    ${logoSrc?`<img src="${logoSrc}" alt="GJR">`:''}
    <div><h1>RENDICIÓN DE VIÁTICOS</h1><div class="emp">GRUPO JUAN RUIZ S.A.C.</div></div>
  </div>
  <div class="datos">
    <div><b>Motivo:</b> ${escapeHtml(r.motivo||'')}</div>
    <div><b>Fecha de rendición:</b> ${(r.createdAt||'').slice(0,10)}</div>
    <div><b>Apellidos y nombres:</b> ${escapeHtml(r.persona||'')}</div>
    <div><b>DNI / C.E.:</b> ${escapeHtml(r.dni||'')}</div>
    <div><b>Dinero sujeto a rendición S/.:</b> ${fmt(r.dsrSoles)}</div>
    <div><b>Dinero sujeto a rendición US$:</b> ${fmt(r.dsrDolares)}</div>
  </div>
  <table>
    <thead><tr>
      <th rowspan="2">Nº</th><th rowspan="2">Fecha</th><th rowspan="2">Concepto</th><th rowspan="2">Nº Comprobante</th><th rowspan="2">U.N.</th>
      <th colspan="5">Viáticos</th><th rowspan="2">Pasajes</th><th rowspan="2">Movilidad Local</th><th rowspan="2">Total Gasto</th><th rowspan="2">Mon.</th>
    </tr><tr>
      <th>Alojamiento</th><th>Desayuno</th><th>Almuerzo</th><th>Cena</th><th>Otros</th>
    </tr></thead>
    <tbody>${filas}
      ${totRow('Soles', t.Soles)}
      ${totRow('Dólares', t['Dólares'])}
    </tbody>
  </table>
  <div class="saldos">
    <div><b>SALDO A FAVOR SOLES:</b> S/. ${fmt(r.dsrSoles - t.Soles.total)}</div>
    <div><b>SALDO A FAVOR DÓLARES:</b> US$ ${fmt(r.dsrDolares - t['Dólares'].total)}</div>
  </div>
  <div class="firmas">
    <div>FIRMA TRABAJADOR<br>${escapeHtml(r.persona||'')}</div>
    <div>FIRMA EMPLEADOR</div>
  </div>
  <script>window.onload = function(){ window.print(); };<\/script>
  </body></html>`);
  w.document.close();
}

/* ---------------- utils ---------------- */
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

/* ---------------- tabs ---------------- */
function switchTab(name){
  document.querySelectorAll('.tab-btn').forEach(b=> b.classList.toggle('active', b.dataset.tab===name));
  document.querySelectorAll('.panel').forEach(p=> p.classList.toggle('active', p.id==='panel-'+name));
}
document.querySelectorAll('.tab-btn').forEach(b=> b.addEventListener('click', ()=> switchTab(b.dataset.tab)));

document.getElementById('personaGlobal').addEventListener('change', e=>{
  if(e.target.value==='__otro__'){
    const val = prompt('Nombre:');
    window.__otroPersona = val || 'Otro';
  }
});

/* ---------------- init ---------------- */
let USUARIO_ACTUAL = null;
let IS_ADMIN = true; // por defecto admin si no hay sesión (vista previa)

(async function init(){
  USUARIO_ACTUAL = usuarioSesion();
  if(USUARIO_ACTUAL){
    IS_ADMIN = esAdmin();
    const sel = document.getElementById('personaGlobal');
    // Fijar el selector al usuario de la sesión
    let found = false;
    [...sel.options].forEach(o=>{ if(normalizar(o.value).includes(normalizar(USUARIO_ACTUAL)) || normalizar(USUARIO_ACTUAL).includes(normalizar(o.value))){ sel.value = o.value; found = true; } });
    if(!found){
      const opt = document.createElement('option');
      opt.value = USUARIO_ACTUAL; opt.textContent = USUARIO_ACTUAL;
      sel.appendChild(opt); sel.value = USUARIO_ACTUAL;
    }
    if(!IS_ADMIN) sel.disabled = true;
  }
  await loadRendiciones();
  renderNueva();
  renderHistorial();
  renderStats();
})();

function rendicionesVisibles(){
  if(IS_ADMIN) return allRendiciones;
  const yo = normalizar(personaValue());
  return allRendiciones.filter(r => normalizar(r.persona) === yo);
}
