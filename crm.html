<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>GJR · CRM Comercial</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#1B5E20; --verde-medio:#2E7D32; --verde-claro:#43A047;
  --verde-pale:#E8F5E9; --verde-border:#C8E6C9; --acento:#F9A825;
  --texto:#1A1A1A; --texto-suave:#5C6060; --fondo:#F7F8F5; --blanco:#FFFFFF;
  --sombra:0 2px 12px rgba(27,94,32,.10); --radio:10px;
  --error:#C62828; --error-bg:#FFEBEE; --error-border:#FFCDD2;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--fondo);color:var(--texto);font-size:14px;line-height:1.5}

/* ═══ HEADER GJR ═══ */
.gjr-header{background:#1B5E20;color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,0.25)}
.gjr-header img{height:40px;object-fit:contain;filter:brightness(0) invert(1);flex-shrink:0}
.gjr-header h1{font-family:'DM Serif Display',serif;font-size:20px;font-weight:400;letter-spacing:.3px;margin:0}
.gjr-header span{font-size:11px;opacity:.7;font-weight:300;display:block;margin-top:1px}
.gjr-header-back{margin-left:auto;display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.28);color:rgba(255,255,255,0.90);padding:6px 14px;border-radius:18px;font-size:11.5px;font-weight:600;text-decoration:none;transition:background .2s;white-space:nowrap}
.gjr-header-back:hover{background:rgba(255,255,255,0.22)}

/* ═══ TABS ═══ */
.tabs{background:var(--verde-medio);display:flex;overflow-x:auto;position:sticky;top:69px;z-index:9998}
.tab{padding:11px 20px;color:rgba(255,255,255,.75);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
.tab.active{color:#fff;border-bottom-color:var(--acento)}

main{max-width:1000px;margin:0 auto;padding:18px 14px 60px}
.card{background:var(--blanco);border:1px solid var(--verde-border);border-radius:var(--radio);box-shadow:var(--sombra);padding:16px;margin-bottom:14px}
.card-title{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--verde);margin-bottom:12px}
.card-title::before{content:"";width:3px;height:14px;background:var(--acento);border-radius:2px;flex-shrink:0}

/* ═══ CONTROLES ═══ */
label.f{display:block;font-size:11px;font-weight:600;color:var(--texto-suave);margin-bottom:4px}
input[type=text],input[type=date],input[type=email],select,textarea{width:100%;font-family:'DM Sans',sans-serif;font-size:13.5px;color:var(--texto);background:#fff;border:1px solid var(--verde-border);border-radius:6px;padding:8px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--verde-claro);box-shadow:0 0 0 2px rgba(67,160,71,.15)}
textarea{resize:vertical;min-height:90px;line-height:1.55}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:640px){.g2,.g3{grid-template-columns:1fr}}
.btn{font-family:'DM Sans',sans-serif;font-size:12.5px;font-weight:600;padding:8px 16px;border-radius:6px;border:1px solid transparent;cursor:pointer;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn-primary{background:var(--verde);color:#fff}
.btn-outline{background:#fff;color:var(--verde);border-color:var(--verde-border)}
.btn-gold{background:var(--acento);color:var(--verde)}
.btn-danger{background:#fff;color:var(--error);border-color:var(--error-border)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.status-bar{background:var(--verde-pale);border:1px solid var(--verde-border);border-radius:6px;padding:9px 12px;font-size:12.5px;color:var(--verde);margin-bottom:12px}
.status-bar.error{background:var(--error-bg);border-color:var(--error-border);color:var(--error)}
.muted{color:var(--texto-suave);font-size:12px}

/* ═══ FILTROS ═══ */
.filtros{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
@media(max-width:640px){.filtros{grid-template-columns:1fr}}

/* ═══ LISTA ═══ */
.fila{display:grid;grid-template-columns:1fr 120px 118px 96px;gap:10px;align-items:center;padding:11px 12px;border:1px solid var(--verde-border);border-radius:8px;background:#fff;margin-bottom:7px;cursor:pointer;transition:border-color .15s,background .15s}
.fila:hover{border-color:var(--verde-claro);background:#FBFDFA}
.fila .emp{font-weight:600;font-size:13.5px;color:var(--texto);line-height:1.3}
.fila .sub{font-size:11.5px;color:var(--texto-suave);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila .pais{font-size:12px;color:var(--texto-suave)}
.fila .ult{font-size:11.5px;color:var(--texto-suave);text-align:right}
@media(max-width:640px){
  .fila{grid-template-columns:1fr auto;gap:6px}
  .fila .pais{display:none}
  .fila .ult{text-align:left;grid-column:1/-1}
}
.pill{display:inline-block;padding:3px 10px;border-radius:14px;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;text-align:center}
.p-nuevo{background:#ECEFF1;color:#546E7A}
.p-contactado{background:#E3F2FD;color:#1565C0}
.p-respondio{background:#FFF8E1;color:#EF6C00}
.p-negociando{background:#FFF3E0;color:#E65100}
.p-cliente{background:var(--verde-pale);color:var(--verde)}
.p-descartado{background:#FAFAFA;color:#9E9E9E}

/* ═══ FICHA ═══ */
.ficha-top{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.ficha-top h2{font-family:'DM Serif Display',serif;font-size:22px;font-weight:400;line-height:1.2}
.dato{margin-bottom:9px}
.dato .k{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--texto-suave)}
.dato .v{font-size:13.5px;word-break:break-word}
.dato .v a{color:var(--verde-medio);text-decoration:none}
.dato .v a:hover{text-decoration:underline}

/* ═══ TIMELINE ═══ */
.tl{border-left:2px solid var(--verde-border);margin-left:6px;padding-left:14px}
.tl-item{position:relative;padding-bottom:16px}
.tl-item::before{content:"";position:absolute;left:-21px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--verde-claro);border:2px solid #fff}
.tl-item.recibido::before{background:var(--acento)}
.tl-head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:3px}
.tl-tipo{font-size:11px;font-weight:600;color:var(--verde);text-transform:uppercase;letter-spacing:.4px}
.tl-fecha{font-size:11px;color:var(--texto-suave)}
.tl-texto{font-size:13px;white-space:pre-wrap;line-height:1.55;background:#FBFDFA;border:1px solid var(--verde-border);border-radius:6px;padding:9px 11px;max-height:230px;overflow:auto}
.tl-analisis{margin-top:8px;background:#FFFDF3;border:1px solid #F5E2A8;border-radius:6px;padding:10px 12px;font-size:12.5px}
.tl-analisis h4{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#8D6E00;margin-bottom:5px;font-weight:600}
.tl-analisis ul{margin:4px 0 6px 16px}
.barra{display:inline-block;letter-spacing:2px;color:var(--acento);font-size:13px}

/* ═══ PANEL ═══ */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kpi{background:#fff;border:1px solid var(--verde-border);border-radius:8px;padding:12px}
.kpi .n{font-family:'DM Serif Display',serif;font-size:26px;color:var(--verde);line-height:1}
.kpi .l{font-size:11px;color:var(--texto-suave);margin-top:3px}
.hide{display:none}
</style>

/* ════════ DATOS ════════ */
var datos = [];
var fichaId = null;

function uid(){ return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function quien(){ try{ return sessionStorage.getItem('gjr_nombre') || 'Equipo GJR'; }catch(e){ return 'Equipo GJR'; } }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function hoy(){ return new Date().toISOString().slice(0,10); }

function cargar(){
  var raw = null;
  try{ raw = localStorage.getItem(KEY); }catch(e){}
  if(raw){
    try{ datos = JSON.parse(raw) || []; }catch(e){ datos = []; }
  }
  if(!raw || !datos.length){
    datos = CONTACTOS_SEED.slice();
    guardar();
  }
  datos.forEach(function(c){ if(!Array.isArray(c.timeline)) c.timeline = []; });
}
function guardar(){
  try{ localStorage.setItem(KEY, JSON.stringify(datos)); }catch(e){}
}
function porId(id){ for(var i=0;i<datos.length;i++){ if(datos[i].id===id) return datos[i]; } return null; }
function ultimaFecha(c){
  if(!c.timeline || !c.timeline.length) return '';
  var f = '';
  c.timeline.forEach(function(t){ if(t.fecha > f) f = t.fecha; });
  return f;
}
function diasDesde(f){
  if(!f) return null;
  return Math.round((new Date(hoy()) - new Date(f)) / 86400000);
}

/* ════════ NAVEGACIÓN ════════ */
function setTab(t){
  ['agenda','actividad','panel'].forEach(function(x){
    document.getElementById('tab_'+x).classList.toggle('hide', x!==t);
  });
  document.querySelectorAll('.tab').forEach(function(el){
    el.classList.toggle('active', el.getAttribute('data-tab')===t);
  });
  if(t==='actividad') renderActividad();
  if(t==='panel') renderPanel();
  window.scrollTo(0,0);
}

/* ════════ LISTA ════════ */
function paises(){
  var s = {};
  datos.forEach(function(c){ if(c.pais) s[c.pais]=1; });
  return Object.keys(s).sort();
}
function llenarFiltros(){
  var sel = document.getElementById('fPais'), v = sel.value;
  sel.innerHTML = '<option value="">Todos</option>' + paises().map(function(p){ return '<option>'+esc(p)+'</option>'; }).join('');
  sel.value = v;
  var se = document.getElementById('fEstado');
  if(se.options.length <= 1){
    se.innerHTML = '<option value="">Todos</option>' + ESTADOS.map(function(e){ return '<option value="'+e+'">'+ESTADO_TXT[e]+'</option>'; }).join('');
  }
}
function filtrados(){
  var q = (document.getElementById('q').value||'').toLowerCase().trim();
  var p = document.getElementById('fPais').value;
  var e = document.getElementById('fEstado').value;
  return datos.filter(function(c){
    if(p && c.pais !== p) return false;
    if(e && (c.estado||'nuevo') !== e) return false;
    if(!q) return true;
    var blob = [c.empresa,c.contacto,c.email,c.notas,c.pais].join(' ').toLowerCase();
    return blob.indexOf(q) >= 0;
  });
}
function renderLista(){
  llenarFiltros();
  var arr = filtrados().slice().sort(function(a,b){ return (a.empresa||'').localeCompare(b.empresa||''); });
  document.getElementById('resumenLista').textContent = arr.length + ' de ' + datos.length + ' contactos';
  if(!arr.length){
    document.getElementById('lista').innerHTML = '<div class="status-bar">No hay contactos con esos filtros. Cambia la búsqueda o crea uno nuevo.</div>';
    return;
  }
  document.getElementById('lista').innerHTML = arr.map(function(c){
    var est = c.estado || 'nuevo';
    var uf = ultimaFecha(c);
    var d = diasDesde(uf);
    var ultTxt = uf ? ('hace ' + d + ' d') : 'sin contacto';
    return '<div class="fila" onclick="abrirFicha(\''+c.id+'\')">'
      + '<div><div class="emp">'+esc(c.empresa)+'</div><div class="sub">'+esc(c.contacto || c.email || '')+'</div></div>'
      + '<div class="pais">'+esc(c.pais||'')+'</div>'
      + '<div><span class="pill p-'+est+'">'+ESTADO_TXT[est]+'</span></div>'
      + '<div class="ult">'+ultTxt+'</div>'
      + '</div>';
  }).join('');
}

}
function renderFicha(){

     + '<span class="pill p-'+est+'" style="margin-top:6px">'+ESTADO_TXT[est]+'</span></div>';

  h += '<div class="grid g2" style="margin-top:14px">';

  h += dato('Cargo', c.cargo);

  h += dato('Notas', c.notas);

  h += '<div><label class="f">Estado</label><select id="fEst" onchange="cambiarEstado()">'
     + ESTADOS.map(function(e){ return '<option value="'+e+'"'+(e===est?' selected':'')+'>'+ESTADO_TXT[e]+'</option>'; }).join('') + '</select></div>';
  h += '<div><label class="f">Próxima acción</label><input type="text" id="fAcc" value="'+esc(c.proxima_accion||'')+'" onchange="guardarAccion()" placeholder="Ej. reenviar oferta"></div>';
  h += '<div><label class="f">Fecha</label><input type="date" id="fAccF" value="'+esc(c.proxima_fecha||'')+'" onchange="guardarAccion()"></div>';
  h += '</div>';
  h += '<div class="btn-row" style="margin-top:12px"><button class="btn btn-outline" onclick="editarContacto()">Editar datos</button>'
     + '<button class="btn btn-danger" onclick="borrarContacto()">Eliminar contacto</button></div>';
  h += '</div>';

  h += '<div class="card"><div class="card-title">Registrar movimiento</div>';
  h += '<div class="grid g2"><div><label class="f">Tipo</label><select id="nTipo">'
     + TIPOS.map(function(t){ return '<option value="'+t+'">'+TIPO_TXT[t]+'</option>'; }).join('') + '</select></div>';
  h += '<div><label class="f">Fecha</label><input type="date" id="nFecha" value="'+hoy()+'"></div></div>';
  h += '<div style="margin-top:10px"><label class="f">Texto del correo o de la nota</label>'
     + '<textarea id="nTexto" placeholder="Pega aquí el correo tal cual, o escribe la nota"></textarea></div>';
  h += '<div class="btn-row" style="margin-top:10px"><button class="btn btn-primary" onclick="agregarMovimiento()">Guardar movimiento</button>'
     + '<button class="btn btn-gold" onclick="agregarYAnalizar()">Guardar y analizar</button></div>';
  h += '<div id="aiMsg"></div></div>';

  h += '<div class="card"><div class="card-title">Historial</div>';
  var tl = (c.timeline||[]).slice().sort(function(a,b){ return (b.fecha||'').localeCompare(a.fecha||'') || (b.creado||'').localeCompare(a.creado||''); });
  if(!tl.length){
    h += '<div class="status-bar">Todavía no hay movimientos. Registra el primer correo o llamada arriba.</div>';
  } else {
    h += '<div class="tl">' + tl.map(function(t){ return itemTL(t, c.id); }).join('') + '</div>';
  }
  h += '</div>';

  document.getElementById('vistaFicha').innerHTML = h;
}
function dato(k, v, raw){
  if(!v) return '';
  return '<div class="dato"><div class="k">'+k+'</div><div class="v">'+(raw? v : esc(v))+'</div></div>';
}
function itemTL(t, cid){
  var cls = (t.tipo==='correo recibido') ? ' recibido' : '';
  var h = '<div class="tl-item'+cls+'">';
  h += '<div class="tl-head"><span class="tl-tipo">'+(TIPO_TXT[t.tipo]||esc(t.tipo))+'</span>'
     + '<span class="tl-fecha">'+esc(t.fecha||'')+' · '+esc(t.autor||'')+'</span>'
     + '<span style="margin-left:auto"><button class="btn btn-outline" style="padding:3px 9px;font-size:11px" onclick="borrarMovimiento(\''+cid+'\',\''+t.id+'\')">Eliminar</button></span></div>';
  if(t.texto) h += '<div class="tl-texto">'+esc(t.texto)+'</div>';
  if(!t.analisis && (t.tipo==='correo recibido' || t.tipo==='correo enviado')){
    h += '<div class="btn-row" style="margin-top:7px"><button class="btn btn-gold" style="padding:5px 12px;font-size:11.5px" onclick="analizar(\''+cid+'\',\''+t.id+'\')">Analizar con IA</button></div>';
  }
  if(t.analisis) h += bloqueAnalisis(t.analisis);
  h += '</div>';
  return h;
}
function bloqueAnalisis(a){
  var barras = '';
  var n = Math.max(0, Math.min(5, parseInt(a.interes,10) || 0));
  for(var i=0;i<5;i++) barras += (i<n ? '●' : '○');
  var h = '<div class="tl-analisis"><h4>Lectura de la negociación</h4>';
  h += '<div style="margin-bottom:5px">Interés: <span class="barra">'+barras+'</span> '+n+'/5</div>';
  if(a.resumen) h += '<div style="margin-bottom:5px">'+esc(a.resumen)+'</div>';
  if(a.senales && a.senales.length) h += '<div><strong>Señales:</strong><ul>'+a.senales.map(function(s){ return '<li>'+esc(s)+'</li>'; }).join('')+'</ul></div>';
  if(a.objeciones && a.objeciones.length) h += '<div><strong>Objeciones:</strong><ul>'+a.objeciones.map(function(s){ return '<li>'+esc(s)+'</li>'; }).join('')+'</ul></div>';
  if(a.siguiente_paso) h += '<div style="margin-top:4px"><strong>Siguiente paso:</strong> '+esc(a.siguiente_paso)+'</div>';
  if(a.riesgo) h += '<div style="margin-top:4px"><strong>Riesgo:</strong> '+esc(a.riesgo)+'</div>';
  h += '</div>';
  return h;
}

  var c = {id:uid(), empresa:emp.trim(), pais:(prompt('País:')||'').trim(), contacto:(prompt('Persona de contacto:')||'').trim(),
           cargo:'', email:(prompt('Correo:')||'').trim(), tel:'', web:'', notas:'',
           estado:'nuevo', timeline:[], creado:new Date().toISOString()};

/* ════════ MOVIMIENTOS ════════ */
function agregarMovimiento(silencioso){
  var c = porId(fichaId); if(!c) return null;
  var texto = document.getElementById('nTexto').value.trim();
  var tipo = document.getElementById('nTipo').value;
  var fecha = document.getElementById('nFecha').value || hoy();
  if(!texto){ msgAI('Escribe o pega el texto antes de guardar.', true); return null; }
  var t = {id:uid(), tipo:tipo, fecha:fecha, texto:texto, autor:quien(), creado:new Date().toISOString()};
  c.timeline.push(t);
  if(tipo==='correo enviado' && (c.estado==='nuevo'||!c.estado)) c.estado = 'contactado';
  if(tipo==='correo recibido' && (c.estado==='nuevo'||c.estado==='contactado')) c.estado = 'respondio';
  guardar();
  if(!silencioso) renderFicha();
  return t;
}
function borrarMovimiento(cid, tid){
  var c = porId(cid); if(!c) return;
  if(!confirm('¿Eliminar este movimiento?')) return;
  c.timeline = c.timeline.filter(function(t){ return t.id !== tid; });
  guardar(); renderFicha();
}
function msgAI(txt, err){
  var el = document.getElementById('aiMsg');
  if(!el) return;
  el.innerHTML = '<div class="status-bar'+(err?' error':'')+'" style="margin-top:10px">'+esc(txt)+'</div>';
}
function agregarYAnalizar(){
  var t = agregarMovimiento(true);
  if(!t) return;
  renderFicha();
  analizar(fichaId, t.id);
}

/* ════════ IA ════════ */
var SYS_AI = 'Eres analista comercial de Grupo Juan Ruiz SAC, exportador peruano de palta Hass y mango que vende a importadores y distribuidores internacionales. '
  + 'Recibes un correo o nota de una negociación y el historial previo con ese contacto. '
  + 'Devuelves SOLO un objeto JSON, sin texto alrededor y sin comillas de bloque, con esta forma exacta: '
  + '{"interes":0-5,"resumen":"una o dos frases","senales":["..."],"objeciones":["..."],"siguiente_paso":"acción concreta y corta","riesgo":"riesgo principal o cadena vacía"}. '
  + 'Sé directo y concreto, sin adornos. Escribe en español aunque el correo esté en otro idioma. '
  + 'interes es la probabilidad real de cerrar negocio: 0 sin interés, 5 listo para comprar.';

function parseJSON(txt){
  var t = String(txt).trim();
  t = t.replace(/^```(json)?/i,'').replace(/```$/,'').trim();
  var m = t.match(/\{[\s\S]*\}/);
  if(m) t = m[0];
  return JSON.parse(t);
}
async function analizar(cid, tid){
  var c = porId(cid); if(!c) return;
  var t = null;
  c.timeline.forEach(function(x){ if(x.id===tid) t = x; });
  if(!t) return;
  msgAI('Analizando el correo…');
  var previos = c.timeline.filter(function(x){ return x.id!==tid; })
    .sort(function(a,b){ return (a.fecha||'').localeCompare(b.fecha||''); })
    .slice(-4)
    .map(function(x){ return '[' + x.fecha + '] ' + (TIPO_TXT[x.tipo]||x.tipo) + ': ' + String(x.texto).slice(0,700); })
    .join('\n---\n');
  var prompt = 'Contacto: ' + c.empresa + ' (' + (c.pais||'') + ')'
    + (c.contacto ? ' — ' + c.contacto : '')
    + '\nEstado actual: ' + (ESTADO_TXT[c.estado||'nuevo'])
    + (previos ? '\n\nHistorial previo:\n' + previos : '')
    + '\n\nMovimiento a analizar (' + (TIPO_TXT[t.tipo]||t.tipo) + ', ' + t.fecha + '):\n' + t.texto;
  try{
    var res = await fetch(AI_PROXY_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:800,
        system: SYS_AI,
        messages:[{role:'user', content: prompt}]
      })
    });
    if(!res.ok) throw new Error('el servicio de IA respondió ' + res.status);
    var data = await res.json();
    var block = (data.content||[]).find(function(b){ return b.type==='text'; });
    if(!block) throw new Error('la IA no devolvió texto');
    t.analisis = parseJSON(block.text);
    t.analisis.at = new Date().toISOString();
    guardar();
    renderFicha();
  }catch(e){
    msgAI('No se pudo analizar: ' + e.message + '. El movimiento quedó guardado igual.', true);
  }
}

          + '<span class="tl-fecha">'+(TIPO_TXT[x.t.tipo]||'')+' · '+esc(x.t.fecha)+'</span>'
          + '<span style="margin-left:auto"><button class="btn btn-outline" style="padding:3px 9px;font-size:11px" onclick="setTab(\'agenda\');abrirFicha(\''+x.c.id+'\')">Abrir</button></span></div>'
          + '<div class="tl-texto" style="max-height:90px">'+esc(String(x.t.texto||'').slice(0,300))+'</div></div>';
      }).join('') + '</div>'
    : '<div class="status-bar">Sin movimientos registrados todavía.</div>';
}

/* ════════ PANEL ════════ */
function renderPanel(){
  var porEstado = {};
  ESTADOS.forEach(function(e){ porEstado[e]=0; });
  datos.forEach(function(c){ var e=c.estado||'nuevo'; porEstado[e]=(porEstado[e]||0)+1; });
  var kh = '<div class="kpi"><div class="n">'+datos.length+'</div><div class="l">Contactos</div></div>';
  ESTADOS.forEach(function(e){
    kh += '<div class="kpi"><div class="n">'+porEstado[e]+'</div><div class="l">'+ESTADO_TXT[e]+'</div></div>';
  });
  document.getElementById('kpis').innerHTML = kh;

  var pp = {};
  datos.forEach(function(c){ var p=c.pais||'Sin país'; pp[p]=(pp[p]||0)+1; });
  document.getElementById('porPais').innerHTML = Object.keys(pp).sort().map(function(p){
    return '<div style="display:flex;justify-content:space-between;padding:6px 2px;border-bottom:1px solid var(--verde-border)">'
      + '<span>'+esc(p)+'</span><strong>'+pp[p]+'</strong></div>';
  }).join('');

  var dorm = datos.filter(function(c){
    if((c.estado||'nuevo')==='descartado') return false;
    var uf = ultimaFecha(c);
    if(!uf) return (c.estado||'nuevo') !== 'nuevo';
    return diasDesde(uf) > 30;
  }).sort(function(a,b){ return (ultimaFecha(a)||'').localeCompare(ultimaFecha(b)||''); });
  document.getElementById('dormidos').innerHTML = dorm.length
    ? dorm.map(function(c){
        var uf = ultimaFecha(c);
        return '<div class="fila" onclick="setTab(\'agenda\');abrirFicha(\''+c.id+'\')" style="grid-template-columns:1fr auto">'
          + '<div><div class="emp">'+esc(c.empresa)+'</div><div class="sub">'+ESTADO_TXT[c.estado||'nuevo']+'</div></div>'
          + '<div class="ult">'+(uf ? 'hace '+diasDesde(uf)+' d' : 'sin contacto')+'</div></div>';
      }).join('')
    : '<div class="status-bar">Todos los contactos activos se han tocado en el último mes.</div>';
}

/* ════════ EXCEL ════════ */
function cargarXLSX(){
  return new Promise(function(res, rej){
    if(window.XLSX) return res();
    var s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = function(){ res(); };
    s.onerror = function(){ rej(new Error('no se pudo cargar la librería de Excel')); };
    document.head.appendChild(s);
  });
}
async function exportarExcel(){
  try{
    await cargarXLSX();
    var filas = datos.map(function(c){
      var uf = ultimaFecha(c);
      return {
        EMPRESA:c.empresa||'', PAIS:c.pais||'', CONTACTO:c.contacto||'', CARGO:c.cargo||'',
        EMAIL:c.email||'', TELEFONO:c.tel||'', WEB:c.web||'', ESTADO:ESTADO_TXT[c.estado||'nuevo'],
        MOVIMIENTOS:(c.timeline||[]).length, ULTIMO_CONTACTO:uf||'',
        PROXIMA_ACCION:c.proxima_accion||'', PROXIMA_FECHA:c.proxima_fecha||'', NOTAS:c.notas||''
      };
    });
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(filas), 'CONTACTOS');
    var mov = [];
    datos.forEach(function(c){
      (c.timeline||[]).forEach(function(t){
        mov.push({EMPRESA:c.empresa, PAIS:c.pais||'', FECHA:t.fecha||'', TIPO:TIPO_TXT[t.tipo]||t.tipo,
                  AUTOR:t.autor||'', INTERES:(t.analisis&&t.analisis.interes)||'', TEXTO:String(t.texto||'').slice(0,2000)});
      });
    });
    mov.sort(function(a,b){ return (b.FECHA||'').localeCompare(a.FECHA||''); });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(mov), 'MOVIMIENTOS');
    XLSX.writeFile(wb, 'CRM_GJR_' + hoy() + '.xlsx');
  }catch(e){ alert('No se pudo exportar: ' + e.message); }
}
async function importarExcel(input){
  var file = input.files[0];
  if(!file) return;
  try{
    await cargarXLSX();
    var buf = await file.arrayBuffer();
    var wb = XLSX.read(buf, {type:'array'});
    var nuevos = 0, actualizados = 0;
    wb.SheetNames.forEach(function(nombre){
      var filas = XLSX.utils.sheet_to_json(wb.Sheets[nombre], {defval:''});
      filas.forEach(function(f){
        var g = function(){
          for(var i=0;i<arguments.length;i++){
            var k = arguments[i];
            for(var key in f){ if(key.toUpperCase().trim() === k) return String(f[key]).trim(); }
          }
          return '';
        };
        var empresa = g('EMPRESA','NOMBRE','COMPANY');
        if(!empresa) return;
        var email = g('EMAIL','CORREO','E-MAIL');
        var ya = null;
        datos.forEach(function(c){
          if(c.empresa && c.empresa.toLowerCase() === empresa.toLowerCase()) ya = c;
          else if(email && c.email && c.email.toLowerCase() === email.toLowerCase()) ya = c;
        });
        var pais = g('PAIS','PAÍS','COUNTRY') || (nombre.length < 20 ? nombre : '');
        if(ya){
          if(!ya.email && email) ya.email = email;
          if(!ya.contacto) ya.contacto = g('CONTACTO','PERSONA','NOMBRE CONTACTO');
          if(!ya.tel) ya.tel = g('TELEFONO','TELÉFONO','TEL','PHONE');
          if(!ya.web) ya.web = g('WEB','SITIO','WEBSITE');
          actualizados++;
        } else {
          datos.push({id:uid(), empresa:empresa, pais:pais,
            contacto:g('CONTACTO','PERSONA','NOMBRE CONTACTO'), cargo:g('CARGO','PUESTO','TITLE'),
            email:email, tel:g('TELEFONO','TELÉFONO','TEL','PHONE'), web:g('WEB','SITIO','WEBSITE'),
            notas:g('NOTAS','OBSERVACIONES'), estado:'nuevo', timeline:[], creado:new Date().toISOString()});
          nuevos++;
        }
      });
    });
    guardar(); renderLista();
    alert('Importación terminada: ' + nuevos + ' contactos nuevos, ' + actualizados + ' actualizados.');
  }catch(e){
    alert('No se pudo importar: ' + e.message);
  }
  input.value = '';
}

/* ════════ ARRANQUE ════════ */
cargar();
renderLista();
</script>
